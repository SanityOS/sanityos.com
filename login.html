<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SanityOS — Login</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="supabase-url" content="<!-- SUPABASE_URL -->">
  <meta name="supabase-key" content="<!-- SUPABASE_ANON_KEY -->">
</head>
<body>
  <main class="auth-shell fade-in">
    <div class="auth-card glass">
      <div class="auth-tabs">
        <button class="tab active" data-tab="signin">Sign In</button>
        <button class="tab" data-tab="signup">Create Account</button>
        <button class="tab" data-tab="forgot">Forgot Password</button>
      </div>

      <div class="tab-panels">
        <form id="signin" class="panel active">
          <label>Email<input type="email" name="email" required></label>
          <label>Password<input type="password" name="password" required></label>
          <div class="row">
            <button class="btn btn-primary" type="submit">Sign In</button>
            <button type="button" class="btn btn-outline" id="oauth-google">Continue with Google</button>
          </div>
        </form>

        <form id="signup" class="panel">
          <label>Full name<input type="text" name="name" required></label>
          <label>Email<input type="email" name="email" required></label>
          <label>Password<input type="password" name="password" required></label>
          <div class="row">
            <button class="btn btn-primary" type="submit">Create Account</button>
          </div>
        </form>

        <form id="forgot" class="panel">
          <label>Email<input type="email" name="email" required></label>
          <div class="row">
            <button class="btn btn-primary" type="submit">Reset Password</button>
          </div>
        </form>
      </div>

      <div class="oauth-row muted">Other providers: <button class="btn btn-outline" disabled>GitHub</button> <button class="btn btn-outline" disabled>Apple (Soon)</button></div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    // Tab behavior
    document.querySelectorAll('.auth-tabs .tab').forEach(btn => btn.addEventListener('click', e => {
      document.querySelectorAll('.auth-tabs .tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById(e.target.dataset.tab).classList.add('active');
    }));

    // Form handlers rely on app.js Supabase helpers
    document.getElementById('signin').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value;
      const password = form.password.value;
      window.SanityAuth && window.SanityAuth.signIn({ email, password });
    });

    document.getElementById('signup').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value;
      const password = form.password.value;
      const name = form.name.value;
      window.SanityAuth && window.SanityAuth.signUp({ email, password, name });
    });

    document.getElementById('forgot').addEventListener('submit', async e => {
      e.preventDefault();
      const email = e.target.email.value;
      window.SanityAuth && window.SanityAuth.resetPassword(email);
      alert('If that email exists, we sent password reset instructions.');
    });
  </script>
</body>
</html>
