<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanityOS | Workspace</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="blob blob-1"></div>

    <header>
        <nav class="nav-container glass">
            <div class="logo">Sanity<span>OS</span></div>
            <div id="credit-display" class="badge glass">Loading credits...</div>
            <button onclick="signOut()" class="btn btn-outline">Sign Out</button>
        </nav>
    </header>

    <main class="hero-section" style="padding-top: 140px;">
        <div class="glass" style="padding: 40px; text-align: left; max-width: 800px; margin: 0 auto;">
            <h2>Luau Script & Architecture Generator</h2>
            <p style="margin-bottom: 20px; font-size: 14px;">Describe the game mechanic, RNG system, or module you need for Roblox Studio.</p>

            <textarea id="ai-prompt" placeholder="e.g., Create a DataStore2 Leaderstats script with automated saving and pet multiplier logic..." style="width: 100%; height: 120px; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--bg-dark); color: white; font-family: inherit; resize: vertical; margin-bottom: 16px;"></textarea>

            <button onclick="runAI()" class="btn btn-primary">Generate Script (5 Credits)</button>

            <div id="output-box" style="display: none; margin-top: 24px;">
                <h3>Output</h3>
                <pre id="code-output" style="background: rgba(0,0,0,0.5); padding: 16px; border-radius: 8px; border: 1px solid var(--glass-border); overflow-x: auto; color: #60a5fa; margin-top: 8px;"></pre>
            </div>
        </div>
    </main>

    <script>
        const supabase = supabase.createClient('https://odvnpzugmjuhpdxeibyf.supabase.co', 'sb_publishable_8CijJp8O7Iv2Xt2QjiCamA_cEv5D6Yc');

        async function loadDashboard() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            const { data, error } = await supabase.from('profiles').select('credits').eq('id', user.id).single();
            if (data) {
                document.getElementById('credit-display').innerText = `⚡ Credits: ${data.credits ?? 0}`;
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        async function runAI() {
            alert("API logic goes here — connect to an OpenAI/Gemini Edge Function!");
        }

        loadDashboard();
    </script>
</body>
</html>
